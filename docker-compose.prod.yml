# Production stack. Local development still uses docker-compose.yml for PostgreSQL only.
# Set PUBLIC_HOST and POSTGRES_PASSWORD in the project .env before starting this file.
# DEBUG and DATABASE_URL from that file are overridden here so the local values are not used.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hrm}
      POSTGRES_USER: ${POSTGRES_USER:-hrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project .env}
    volumes:
      - hrm_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEBUG: "False"
      USE_SQLITE: "False"
      SHOW_API_DOCS: "False"
      ALLOWED_HOSTS: ${PUBLIC_HOST:?Set PUBLIC_HOST in the project .env},127.0.0.1,localhost
      DATABASE_URL: postgres://${POSTGRES_USER:-hrm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hrm}
    volumes:
      - hrm_prod_media:/app/media
      - hrm_prod_static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_URL: ${PUBLIC_API_URL:-/api}
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - hrm_prod_media:/var/www/media:ro
      - hrm_prod_static:/var/www/static:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  hrm_prod_pgdata:
  hrm_prod_media:
  hrm_prod_static:
